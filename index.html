<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171b19">
  <meta name="description" content="Tim van Helsdingen. Artist, developer & maker. Find my projects, videos, and other corners of the internet.">
  <meta property="og:title" content="Tim van Helsdingen">
  <meta property="og:description" content="Artist, developer & maker. A few things I'm working on, and where to find me.">
  <meta property="og:type" content="website">

  <link rel="canonical" href="https://timvanhelsdingen.com/">
  <link rel="icon" href="/assets/tvh-logo.png" type="image/png">
  <title>Tim van Helsdingen</title>
  <style>
    @font-face { font-family: Poppins; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/poppins-regular.ttf') format('truetype'); }
    @font-face { font-family: Poppins; font-style: normal; font-weight: 600; font-display: swap; src: url('/assets/poppins-semibold.ttf') format('truetype'); }
    :root { color-scheme: dark; --paper: #171b19; --ink: #f5f7f5; --muted: #a1ada6; --line: #35453c; --accent: #78c99b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: Poppins, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    body::before { content: ''; position: fixed; inset: 0; background: #1b2720; clip-path: polygon(72% 0, 100% 0, 100% 53%); z-index: -1; }
    main { width: min(100% - 48px, 460px); margin: 0 auto; padding: clamp(30px, 7vh, 72px) 0 30px; }
    header { margin-bottom: 30px; text-align: center; }
    .logo { display: block; width: min(100%, 360px); height: auto; margin: 0 auto 22px; }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .intro { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.9; }
    .intro strong { color: var(--ink); font-weight: 400; font-size: 15px; }
    nav { display: grid; gap: 11px; }
    a { color: inherit; text-decoration: none; }
    .link { min-height: 78px; display: flex; align-items: center; gap: 17px; padding: 17px 20px; border: 1px solid var(--line); border-radius: 5px; background: #202923; transition: background .18s, border-color .18s, transform .18s; }
    .link:hover { background: #29382e; border-color: #649176; transform: translateY(-2px); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .icon { width: 26px; height: 26px; flex: 0 0 26px; display: grid; place-items: center; }
    .icon svg { width: 23px; height: 23px; fill: currentColor; }
    .hellthings { font-size: 26px; font-weight: 800; font-family: Georgia, serif; }
    .label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .detail { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
    .arrow { margin-left: auto; font-size: 23px; font-weight: 300; color: var(--muted); }
    .featured { background: #185536; color: var(--ink); border-color: #29734d; min-height: 86px; }
    .featured .detail, .featured .arrow { color: #bfd6c7; }
    .featured:hover { background: #206842; border-color: #6cb68b; }
    footer { text-align: center; border-top: 1px solid var(--line); margin-top: 28px; padding-top: 19px; font-size: 10px; letter-spacing: .025em; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } .link:hover { transform: none; } }
    @media (max-width: 360px) { main { width: calc(100% - 36px); } .link { padding: 16px; gap: 13px; } }
  </style>
</head>
<body>

</html>
